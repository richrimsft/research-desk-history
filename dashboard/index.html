<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P7RIM3 HQ: PICK YOUR BRANCH</title>
<style>
  :root {
    --bg: #050508;
    --panel: #0e0e14;
    --card: #14141c;
    --border: #2a2a38;
    --text: #f5f5f7;
    --muted: #8b8b9a;
    --pink: #ff2d95;
    --pink-dim: #ff2d9533;
    --blue: #3b82f6;
    --green: #22c55e;
    --orange: #f59e0b;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 36px 8px;
  }
  header h1 {
    font-size: 28px;
    letter-spacing: 0.04em;
    font-weight: 800;
    text-transform: uppercase;
  }
  header .stats {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 0.08em;
  }
  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .profile img {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--pink); object-fit: cover;
  }
  .tree {
    padding: 12px 36px 280px;
    position: relative;
  }
  .prompt {
    display: inline-block;
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 8px 0 18px;
  }
  .branches {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .branch {
    flex: 1 1 180px;
    min-width: 160px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .12s;
    position: relative;
  }
  .branch:hover { transform: translateY(-1px); }
  .branch.active {
    box-shadow: 0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);
    border-color: var(--accent);
  }
  .branch .letter {
    font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700;
  }
  .branch .name { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .branch .sub { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .branch[data-b="A"] { --accent: var(--blue); }
  .branch[data-b="B"] { --accent: var(--pink); }
  .branch[data-b="C"] { --accent: var(--green); }
  .branch[data-b="D"] { --accent: var(--orange); }

  .rail {
    margin: 18px 0 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .rail .tag {
    border: 1px solid var(--border);
    background: #12121a;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .1em;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .rail .tag.on {
    color: #fff;
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 22%, #12121a);
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .card:hover { border-color: #444; }
  .card.selected {
    border-color: var(--pink);
    box-shadow: 0 0 0 1px var(--pink), 0 0 28px var(--pink-dim);
  }
  .card.read::after {
    content: "✓";
    position: absolute; top: 8px; right: 10px;
    background: var(--green); color: #041; width: 20px; height: 20px;
    border-radius: 50%; font-size: 12px; display: grid; place-items: center;
  }
  .card .thumb {
    height: 120px; background: #0a0a10 center/cover no-repeat;
    border-bottom: 1px solid var(--border);
  }
  .card .body { padding: 12px 14px 14px; }
  .card .num {
    font-size: 11px; color: var(--pink); letter-spacing: .1em; font-weight: 700;
  }
  .card .cat { font-size: 10px; color: var(--muted); letter-spacing: .08em; margin-top: 2px; }
  .card .title { font-size: 14px; font-weight: 700; margin-top: 6px; line-height: 1.3; }
  .card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .drawer {
    position: fixed; left: 18px; right: 18px; bottom: 0;
    background: linear-gradient(180deg, #16161f 0%, #0c0c12 100%);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    padding: 22px 26px 16px;
    transform: translateY(110%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    z-index: 40;
    box-shadow: 0 -20px 60px #000a;
    max-height: 46vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-top {
    display: grid;
    grid-template-columns: 180px 1fr auto;
    gap: 20px;
    align-items: start;
  }
  .drawer .big-thumb {
    width: 180px; height: 120px; border-radius: 14px;
    background: #0a0a10 center/cover no-repeat;
    border: 1px solid var(--border);
  }
  .drawer h2 { font-size: 22px; font-weight: 800; }
  .drawer .source {
    margin-top: 6px; font-size: 12px; color: var(--muted);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .drawer .source a { color: var(--pink); text-decoration: none; }
  .drawer .inside {
    margin-top: 12px; font-size: 13px; line-height: 1.45; color: #d4d4de;
  }
  .drawer .inside .arrow { color: var(--pink); font-weight: 700; margin-right: 6px; }
  .drawer .actions {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .btn {
    background: #fff; color: #111; border: none; border-radius: 999px;
    padding: 12px 22px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .btn.done { background: var(--green); color: #042; }
  .progress { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .strip {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  }
  .strip .mini {
    flex: 0 0 auto; width: 64px; height: 40px; border-radius: 8px;
    background: #0a0a10 center/cover no-repeat; border: 1px solid var(--border);
    cursor: pointer; opacity: .75;
  }
  .strip .mini.on { opacity: 1; border-color: var(--pink); }
  .close-x {
    position: absolute; top: 14px; right: 18px;
    background: transparent; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer;
  }
  .kraken-table {
    width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px;
  }
  .kraken-table th, .kraken-table td {
    text-align: left; padding: 4px 8px; border-bottom: 1px solid #222;
    color: #ccc;
  }
  .kraken-table th { color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; letter-spacing: .06em; border: 1px solid var(--border);
  }
  .badge.ok { color: var(--green); border-color: #14532d; }
  .badge.warn { color: var(--orange); border-color: #78350f; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; height: 0; pointer-events: none;
  }
</style>
</head>

<script>

  function fmtBytes(n) {
    if (n == null) return "—";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function buildCards(data) {
    const f = (data && data.files) || {};

    const holdings = latest.holdings || [];
    const holdStr = holdings
      .filter((h) => h.asset !== "USD" || (h.usd != null ? h.usd : h.qty) > 0)
      .map((h) => {
        if (h.usd != null) return h.asset + " $" + h.usd.toFixed(2);
        return h.asset + " " + h.qty;
      })
      .join(" · ");

    const cards = [
      // A — Bots
      {
        id: 1, branch: "A", group: "RESEARCH DESK",

        inside: "Primary research bot: REA investigations, web/GitHub scouting, drafting guides. Speaks as @P7RIM3. Does not post or trade without approval.",

      {

      {

      },
      {

      },
      {

        pathKey: "part2_4k",
        inside: "Part 2 4K render for @P7RIM3. Path: /workspace/x-followup/part2_4k.mp4",
      },
      {
        id: 18, branch: "C", group: "ASSETS",
        title: "X avatar (square)",
        thumb: "assets/avatar.png",
        source: "file · p7rim3-avatar-square.png",
        pathKey: "avatar",
        inside: "Profile avatar asset used on X and this dashboard.",
      },
      {
        id: 19, branch: "C", group: "ASSETS",
        title: "X header / banner",
        thumb: "assets/header.png",
        source: "file · p7rim3-header.png",
        pathKey: "header",
        inside: "Profile header/banner asset for @P7RIM3.",
      },

      // D — Kraken
      {
        id: 20, branch: "D", group: "SNAPSHOT",
        title: "Latest portfolio snapshot",
        thumb: "assets/sheet6-trading-paper.jpg",
        source: "markets/snapshots.log",
        pathKey: "snapshots_log",
        krakenKind: "snapshot",
        inside: latest.ts
          ? ("As of " + latest.ts + ": total $" + (latest.total != null ? latest.total.toFixed(2) : "—") +
             ". Holdings: " + (holdStr || "—") +
             ". Action: " + (latest.action || "—") +
             (latest.note ? " — " + latest.note : ""))
          : "No snapshots yet in /workspace/markets/snapshots.log",
      },
      {
        id: 21, branch: "D", group: "TRADES",
        title: "Recent trades",
        thumb: "assets/sheet6-trading-paper.jpg",
        source: "markets/trades.log",
        pathKey: "trades_log",
        krakenKind: "trades",
        inside: (k.trades && k.trades.length)
          ? (k.trades.length + " logged trade(s). Latest: " +
             (k.trades[k.trades.length - 1].pair || "") + " " +
             (k.trades[k.trades.length - 1].side || "") + " @" +
             (k.trades[k.trades.length - 1].price != null ? k.trades[k.trades.length - 1].price : ""))
          : "No trades logged yet.",
      },
      {
        id: 22, branch: "D", group: "RULES",
        title: "Markets Desk rules",
        thumb: "assets/sheet6-trading-paper.jpg",
        source: "markets/RULES.md",
        krakenKind: "rules",
        inside: (k.rules && k.rules.summary) ||
          "Spot BTC/ETH/SOL, no leverage, stop under $60.",
      },
    ];
    return cards;
  }

  const STORE_KEY = "p7rim3_hq_read_v1";
  let state = {
    branch: "B",
    group: null,
    selected: null,
    read: new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")),
  };

  const elBranches = document.getElementById("branches");
  const elRail = document.getElementById("rail");
  const elCards = document.getElementById("cards");
  const elDrawer = document.getElementById("drawer");
  const elStrip = document.getElementById("strip");
  const data = window.HQ_DATA || {};
  const CARDS = buildCards(data);

  document.getElementById("statsLine").textContent =
    CARDS.length + " CARDS / " +
    BRANCHES.length + " BRANCHES / " +
    "READ " + state.read.size + "/" + CARDS.length +
    (data.generated_at ? " · DATA " + data.generated_at : "");

  function saveRead() {
    localStorage.setItem(STORE_KEY, JSON.stringify([...state.read]));
    document.getElementById("statsLine").textContent =
      CARDS.length + " CARDS / " + BRANCHES.length + " BRANCHES / READ " +
      state.read.size + "/" + CARDS.length +
      (data.generated_at ? " · DATA " + data.generated_at : "");
    document.getElementById("progress").textContent =
      state.read.size + "/" + CARDS.length;
  }

  function renderBranches() {
    elBranches.innerHTML = "";
    BRANCHES.forEach((b) => {
      const d = document.createElement("div");
      d.className = "branch" + (state.branch === b.id ? " active" : "");
      d.dataset.b = b.id;
      d.style.setProperty("--accent", ACCENT[b.id]);
      d.innerHTML =
        '<div class="letter">' + b.id + "</div>" +
        '<div class="name">' + b.name + "</div>" +
        '<div class="sub">' + b.sub + '</div>';
      d.onclick = () => {
        state.branch = b.id;
        state.group = null;
        renderAll();
      };
      elBranches.appendChild(d);
    });
  }

  function groupsFor(branch) {
    const g = [];
    CARDS.filter((c) => c.branch === branch).forEach((c) => {
      if (!g.includes(c.group)) g.push(c.group);
    });
    return g;
  }

  function renderRail() {
    elRail.innerHTML = "";
    elRail.style.setProperty("--accent", ACCENT[state.branch]);
    const groups = groupsFor(state.branch);
    const all = document.createElement("div");
    all.className = "tag" + (state.group == null ? " on" : "");
    all.textContent = "ALL";
    all.onclick = () => { state.group = null; renderAll(); };
    elRail.appendChild(all);
    groups.forEach((g) => {
      const t = document.createElement("div");
      t.className = "tag" + (state.group === g ? " on" : "");
      t.textContent = g;
      t.onclick = () => { state.group = g; renderAll(); };
      elRail.appendChild(t);
    });
  }

  function visibleCards() {
    return CARDS.filter(
      (c) => c.branch === state.branch && (state.group == null || c.group === state.group)
    );
  }

  function renderCards() {
    elCards.innerHTML = "";
    visibleCards().forEach((c) => {
      const d = document.createElement("div");
      d.className =
        "card" +
        (state.selected === c.id ? " selected" : "") +
        (state.read.has(c.id) ? " read" : "");
      d.innerHTML =
        '<div class="thumb" style="background-image:url(\'' + c.thumb + '\')"></div>' +
        '<div class="body">' +
        '<div class="num">' + String(c.id).padStart(2, "0") + "</div>" +
        '<div class="cat">' + c.group + "</div>" +
        '<div class="title">' + c.title + "</div>" +
        '<div class="meta">' + c.source + '</div>' +
        "</div>";
      d.onclick = () => openCard(c.id);
      elCards.appendChild(d);
    });
  }

  function fileLine(card) {
    if (!card.pathKey || !data.files || !data.files[card.pathKey]) return "";
    const meta = data.files[card.pathKey];
    if (!meta.exists) return '<p class="meta">Missing: ' + meta.path + "</p>";
    return (
      '<p class="meta">' +
      meta.path + " · " + fmtBytes(meta.bytes) + " · " + meta.mtime +
      "</p>"
    );
  }

  function krakenExtra(card) {
    const k = data.kraken || {};
    if (card.krakenKind === "snapshot") {
      const h = (k.latest && k.latest.holdings) || [];
      if (!h.length) return "";
      let rows = h
        .map(
          (x) =>
            "<tr><td>" +
            x.asset +
            "</td><td>" +
            x.qty +
            "</td><td>" +
            (x.usd != null ? "$" + x.usd.toFixed(2) : "—") +
            "</td><td>" +
            (x.price != null ? x.price : "—") +
            "</td></tr>"
        )
        .join("");
      const total = k.latest && k.latest.total;
      const stop = (k.rules && k.rules.stop_under_usd) || 60;
      const badge =
        total != null && total < stop
          ? '<span class="badge warn">BELOW STOP $' + stop + "</span>"
          : '<span class="badge ok">ABOVE STOP $' + stop + "</span>";
      return (
        badge +
        '<table class="kraken-table"><thead><tr><th>Asset</th><th>Qty</th><th>USD</th><th>Px</th></tr></thead><tbody>' +
        rows +
        "</tbody></table>"
      );
    }
    if (card.krakenKind === "trades") {
      const t = k.trades || [];
      if (!t.length) return "";
      let rows = t
        .map(
          (x) =>
            "<tr><td>" +
            (x.ts || "") +
            "</td><td>" +
            (x.pair || "") +
            "</td><td>" +
            (x.side || "") +
            "</td><td>" +
            (x.qty != null ? x.qty : "") +
            "</td><td>" +
            (x.price != null ? x.price : "") +
            "</td><td>" +
            (x.reason || "") +
            "</td></tr>"
        )
        .join("");
      return (
        '<table class="kraken-table"><thead><tr><th>Time</th><th>Pair</th><th>Side</th><th>Qty</th><th>Px</th><th>Reason</th></tr></thead><tbody>' +
        rows +
        "</tbody></table>"
      );
    }
    if (card.krakenKind === "rules") {
      const r = k.rules || {};
      return (
        '<p class="meta" style="margin-top:8px">Spot: ' +
        (r.spot_only || []).join(", ") +
        " · No leverage: " +
        (r.no_leverage ? "yes" : "?") +
        " · Stop under $" +
        (r.stop_under_usd != null ? r.stop_under_usd : 60) +
        "</p>"
      );
    }
    return "";
  }

  function openCard(id) {
    const c = CARDS.find((x) => x.id === id);
    if (!c) return;
    state.selected = id;
    document.getElementById("dThumb").style.backgroundImage =
      "url('" + c.thumb + "')";
    document.getElementById("dTitle").textContent = c.title;
    document.getElementById("dSource").innerHTML =
      "<span>" + c.source + "</span>" + fileLine(c);
    document.getElementById("dInside").innerHTML =
      '<span class="arrow">→</span><strong>What\'s inside</strong><div style="margin-top:6px">' +
      c.inside +
      "</div>";
    document.getElementById("dExtra").innerHTML = krakenExtra(c);
    const btn = document.getElementById("markBtn");
    if (state.read.has(id)) {
      btn.textContent = "Read ✓";
      btn.classList.add("done");
    } else {
      btn.textContent = "Mark as read";
      btn.classList.remove("done");
    }
    document.getElementById("progress").textContent =
      state.read.size + "/" + CARDS.length;
    renderStrip();
    elDrawer.classList.add("open");
    renderCards();
  }

  function renderStrip() {
    elStrip.innerHTML = "";
    visibleCards().forEach((c) => {
      const m = document.createElement("div");
      m.className = "mini" + (state.selected === c.id ? " on" : "");
      m.style.backgroundImage = "url('" + c.thumb + "')";
      m.title = c.title;
      m.onclick = () => openCard(c.id);
      elStrip.appendChild(m);
    });
  }

  document.getElementById("markBtn").onclick = () => {
    if (state.selected == null) return;
    if (state.read.has(state.selected)) state.read.delete(state.selected);
    else state.read.add(state.selected);
    saveRead();
    openCard(state.selected);
  };
  document.getElementById("closeDrawer").onclick = () => {
    elDrawer.classList.remove("open");
    state.selected = null;
    renderCards();
  };

  function renderAll() {
    renderBranches();
    renderRail();
    renderCards();
    if (state.selected != null) {
      const still = CARDS.find(
        (c) => c.id === state.selected && c.branch === state.branch
      );
      if (!still) {
        elDrawer.classList.remove("open");
        state.selected = null;
      } else renderStrip();
    }
  }

  saveRead();
  renderAll();
  const params = new URLSearchParams(location.search);
  if (params.get("open")) {
    const id = parseInt(params.get("open"), 10);
    const card = CARDS.find((c) => c.id === id);
    if (card) {
      state.branch = card.branch;
      state.group = null;
      renderAll();
      openCard(id);
    }
  }
})();
