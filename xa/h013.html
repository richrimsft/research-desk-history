<html><head><meta charset="utf-8"></head><body><p>Polymarket's own <a href="https://docs.polymarket.com/migrate/data-api-v1-to-v2">Data API v1 to v2 migration guide</a> tells you where the losers are. The new <code>/v2/positions</code> route has a status filter, and <em>"<code>REDEEMABLE_LOST</code> narrows to still-held losing positions."</em> The same page warns that <strong>Data API v1 is retired on October 24, 2026</strong>, so new tools should use v2.</p></body></html>
